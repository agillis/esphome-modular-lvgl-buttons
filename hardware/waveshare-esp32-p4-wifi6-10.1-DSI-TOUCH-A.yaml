# Waveshare ESP32-P4-WIFI6 (DEV-KIT) carrier board + Waveshare 10.1-DSI-TOUCH-A panel.
#
# This is the *two-piece* combination: the Raspberry-Pi-form-factor ESP32-P4-WIFI6
# board with a 10.1inch 800x1280 IPS DSI panel plugged into the 22-pin MIPI-DSI FPC.
# It is NOT the all-in-one ESP32-P4-WIFI6-Touch-LCD-10.1 — see
# hardware/waveshare-esp32-p4-wifi6-touch-lcd-10.1.yaml for that one.
#
# Identical to hardware/waveshare-esp32-p4-wifi6-7-DSI-TOUCH-A.yaml apart from the
# panel: same board, same I2C backlight, same touch, same audio. The 10.1 panel is
# a JD9365 at 800x1280 / 1.5Gbps, where the 7in is an ILI9881C at 720x1280 / 1Gbps.
# The 10.1 also needs the 0x45 panel-enable sequence below; the 7in does not.
#
# For this same 10.1 panel on the ESP32-P4-Module-DEV-KIT carrier (16MB flash),
# see hardware/waveshare-esp32-p4-module-dev-kit-10.1-DSI-TOUCH-A.yaml — the two
# files differ only in flash size and project name.
#
# Board-level notes (all panels on this board):
#   - No LCD reset GPIO      (BSP_LCD_RST      = GPIO_NUM_NC) — panel self-resets
#   - No LCD enable GPIO either — the 10.1 panel is enabled over I2C (device 0x45,
#     register 0x95); see "Panel power/enable" below. Without it the boot wedges in
#     the DSI command FIFO and ends in safe mode with a blank screen.
#   - No backlight PWM GPIO  (BSP_LCD_BACKLIGHT = GPIO_NUM_NC) — brightness is written
#     over I2C to the panel's backlight controller: device 0x45, register 0x96, 0x00-0xFF
#   - No touch INT / RST GPIO (both GPIO_NUM_NC) — GT9271 is polled on the shared I2C bus
#   - No ES7210 mic ADC — the DEV-KIT uses the ES8311's analog mic input only
#
# Board wiki:  https://www.waveshare.com/wiki/ESP32-P4-WIFI6-DEV-KIT
# Panel wiki:  https://www.waveshare.com/wiki/10.1-DSI-TOUCH-A
# Vendor BSP:  https://github.com/waveshareteam/Waveshare-ESP32-components
#              bsp/esp32_p4_platform/esp32_p4_platform.c  (bsp_display_brightness_set)
---

substitutions:
  # Screen Size (native portrait 800x1280)
  # Swapped automatically for 90/270 rotation
  screen_height: ${1280 if rotation | default("0") not in ["90", "270"] else 800}
  screen_width: ${800 if rotation | default("0") not in ["90", "270"] else 1280}

esphome:
  min_version: 2026.7.0
  project:
    name: "Waveshare.ESP32-P4-WIFI6-10-1-DSI-TOUCH-A"
    version: "1.0"
  on_boot:
    - priority: 900
      then:
        - lambda: |-
            auto *bus = id(bus_a);
            uint8_t w[2];
            w[0] = 0x95; w[1] = 0x11; bus->write(0x45, w, 2);
            w[0] = 0x95; w[1] = 0x17; bus->write(0x45, w, 2);
            w[0] = 0x96; w[1] = 0x00; bus->write(0x45, w, 2);
            delay(100);
            w[0] = 0x96; w[1] = 0xFF; bus->write(0x45, w, 2);
            delay(1000);
            ESP_LOGI("panel_pwr", "10.1-DSI-TOUCH-A enabled via 0x45 (0x95=0x17, 0x96=0xFF)");

esp32:
  # Engineering-sample profile, which boots on both ES and production (rev3)
  # silicon. If your boot log says `chip revision: v3.x` you can switch to
  # `board: esp32-p4_r3-evboard` and raise cpu_frequency to 400MHz — but a
  # rev3-only image will NOT boot on an engineering sample, so this stays the
  # conservative default.
  board: esp32-p4-evboard
  variant: esp32p4
  # ESP32-P4NRW32: 32MB NOR flash + 32MB in-package PSRAM.
  # Some early DEV-KIT revisions shipped 16MB flash — change this if the
  # partition table fails to fit.
  flash_size: 32MB
  cpu_frequency: 360MHz
  # The 10.1 panel's JD9365 init sequence is long and runs at 1.5Gbps. The
  # default 5s task watchdog kills display setup mid-init, so give it room.
  watchdog_timeout: 30s
  framework:
    type: esp-idf
    advanced:
      execute_from_psram: true
      enable_idf_experimental_features: true

psram:
  mode: hex
  speed: 200MHz

preferences:
  flash_write_interval: 5min

# Powers the MIPI DSI PHY — the panel stays dark without this.
esp_ldo:
  - voltage: 2.5V
    channel: 3

http_request:  # Needed by esp32_hosted-update and any JSON stuff

# -------------------------------------------
# Network hardware
# -------------------------------------------
# The ESP32-P4 has no radio of its own; the onboard ESP32-C6-MINI-1 provides
# Wi-Fi 6 over SDIO. If the C6 never comes up on your unit, try active_high: false.
esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true

# The board also has a 100M IP101 Ethernet PHY (RMII). Not enabled here because
# common/wifi.yaml is the usual transport. Pins if you want it:
#   type: IP101, mdc_pin: GPIO31, mdio_pin: GPIO52, power_pin: GPIO51,
#   clk: {pin: GPIO50, mode: CLK_EXT_IN}

# Firmware update for esp32_hosted ESP32-C6
update:
  - platform: esp32_hosted
    name: ESP-Hosted Firmware
    icon: mdi:chip
    type: http
    source: https://esphome.github.io/esp-hosted-firmware/manifest/esp32c6.json
    update_interval: 6h

# -------------------------------------------
# Shared I2C bus
# -------------------------------------------
# One bus serves everything: ES8311 codec (0x18), the panel's GT9271 touch
# controller (0x5D), the panel's backlight controller (0x45), plus whatever is
# wired to the I2C header / 40-pin header. Onboard parts top out at 400kHz.
i2c:
  - id: bus_a
    sda: GPIO07
    scl: GPIO08
    frequency: 400kHz
    scan: true

# ---------------------------------------------------------------------------
# Panel power/enable (REQUIRED before the display sets up)
# ---------------------------------------------------------------------------
# This panel is enabled through the board's 0x45 controller, not by a GPIO.
# Waveshare do it inside esp_lcd_new_panel_jd9365() itself, before any DSI
# traffic (managed_components/waveshare__esp_lcd_jd9365/esp_lcd_jd9365.c):
#
#   0x45: 0x95 <- 0x11 ; 0x95 <- 0x17 ; 0x96 <- 0x00 ; delay 100ms ;
#         0x96 <- 0xFF ; delay 1000ms
#
# ESPHome's mipi_dsi only ever writes 0x96 (brightness, and later), and never
# writes 0x95 at all. Without the 0x95 enable the panel does not drive its side
# of the DSI link, so the host can never complete a transfer: the generic command
# FIFO fills after ~19 commands and never drains, tx_param spins forever in
# mipi_dsi_host_ll_gen_is_cmd_fifo_full, and ~30s later the task watchdog aborts
# the boot -- 10 times over, into safe mode with a blank screen. A DCS read hangs
# immediately for the same reason.
#
# Priority 900 runs after the i2c bus (BUS = 1000) and before the display
# component's setup, and the whole sequence is synchronous inside one lambda so
# nothing can interleave ahead of the panel being live.
# -------------------------------------------
# Touchscreen GT9271 (GT911-compatible) over I2C
# -------------------------------------------
# No interrupt or reset pin is routed on the DSI FPC, so the driver polls.
# If the boot scan reports 0x14 instead of 0x5D, add `address: 0x14` here.
touchscreen:
  - platform: gt911
    id: my_touchscreen
    i2c_id: bus_a
    display: main_display
    update_interval: 50ms
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false
    # on_touch:
    #   - lambda: |-
    #       ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%d",
    #                touch.x, touch.y, touch.x_raw, touch.y_raw);

# -------------------------------------------
# Backlight (I2C, not PWM)
# -------------------------------------------
# The 10.1-DSI-TOUCH-A carries its own backlight controller. Brightness is a
# single byte written to register 0x96 of I2C device 0x45 — same as the vendor
# BSP's bsp_display_brightness_set(). (The panel wiki quotes register 0x86; the
# BSP uses 0x96, which is what is confirmed working on this panel.) A template
# output lets the normal monochromatic light (and common/backlight_time.yaml)
# drive it unchanged.
output:
  - platform: template
    id: gpio_backlight_pwm
    type: float
    zero_means_zero: true
    write_action:
      - lambda: |-
          uint8_t level = (uint8_t) lroundf(state * 255.0f);
          uint8_t data[2] = {0x96, level};
          id(bus_a).write(0x45, data, sizeof(data));

light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: Display Backlight
    icon: mdi:lightbulb-on
    id: display_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

# -------------------------------------------
# Display — MIPI DSI, 2 lanes @ 1.5Gbps, JD9365
# -------------------------------------------
display:
  - platform: mipi_dsi
    id: main_display
    # ESPHome's built-in model needs nothing but model + dimensions, exactly like
    # the sibling 7-DSI-TOUCH-A file. An earlier `model: CUSTOM` + inlined JD9365
    # table here was a workaround for a presumed missing post-reset settle; the
    # real fault was the 0x45/0x95 enable above, so the named model is correct.
    # See patches/README.md.
    model: WAVESHARE-10.1-DSI-TOUCH-A
    update_interval: never
    auto_clear_enabled: false
    dimensions:
      width: 800
      height: 1280

# Special LVGL settings required for this display.
# The panel driver does no hardware transform, so rotation is done in LVGL
# (on the ESP32-P4 this is PPA-accelerated, so it is effectively free).
#
# NOTE: native scan order is portrait 800x1280. Pass rotation: "270" from the
# device config for the usual 1280x800 landscape mounting — confirmed upright on
# the ESP32-P4-Module-DEV-KIT carrier, which takes the identical FPC. Use "90" if
# your panel is mounted the other way up.
lvgl:
  rotation: ${rotation | default("0")}

# -------------------------------------------
# Audio devices
# -------------------------------------------
# ES8311 codec on the shared I2C bus, wired to the 3.5mm jack and the
# speaker/mic header. There is no ES7210 on this board — the microphone is the
# codec's own analog input.
i2s_audio:
  - id: audio_bus
    i2s_mclk_pin: GPIO13
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bus_a
    address: 0x18

microphone:
  - platform: i2s_audio
    id: my_microphone
    i2s_audio_id: audio_bus
    i2s_din_pin: GPIO11
    sample_rate: 16000
    bits_per_sample: 16bit
    adc_type: external

speaker:
  - platform: i2s_audio
    id: my_speaker
    i2s_audio_id: audio_bus
    i2s_dout_pin: GPIO9
    audio_dac: es8311_dac
    dac_type: external
    channel: mono
    buffer_duration: 100ms
    bits_per_sample: 16bit
    sample_rate: 48000

  - platform: mixer
    id: mixing_speaker
    output_speaker: my_speaker
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

switch:
  - platform: gpio
    id: audio_amplifier
    name: Speaker Enable
    icon: "mdi:speaker"
    entity_category: config
    pin: GPIO53  # BSP_POWER_AMP_IO, active high
    restore_mode: RESTORE_DEFAULT_ON

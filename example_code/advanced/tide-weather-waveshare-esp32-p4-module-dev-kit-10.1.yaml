# ═══════════════════════════════════════════════════════════════════════════
# LVGL — dark 1280x800 dashboard
# ═══════════════════════════════════════════════════════════════════════════
lvgl:
  # Full-frame buffer in PSRAM (1280x800 RGB565 = 2 MB of the module's 32 MB).
  # The canvases below are repainted wholesale, so partial buffers would just
  # add tear risk for no memory saving.
  buffer_size: 100%
  pages:
    - id: main_page
      bg_color: 0x0B1420
      # Explicit pixel grid so the flip clock's grid_cell_* lands in the
      # (1004,36)-(1240,170) cell. Everything else lives in the transparent
      # full-span overlay (no layout, absolute x/y).
      layout:
        type: grid
        # Clock cell = column 1 / row 1. The trailing FR track (40 px) nearly matches
        # the 36 px top track, so the flip clock sits level with the page insets.
        grid_columns: [1004, 236, FR(1)]
        grid_rows: [36, 134, FR(1)]
      widgets:
        # ── Transparent full-span overlay: ALL content except the flip clock ──
        # `ignore_layout` keeps this obj out of the page grid so it does NOT claim
        # the (1,1) cell the flip clock needs; it renders full-screen via TOP_LEFT.
        - obj:
            id: overlay
            ignore_layout: true
            align: TOP_LEFT
            x: 0
            y: 0
            width: 100%
            height: 100%
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollbar_mode: "OFF"
            scrollable: false
            widgets:
              # ══════════════ LEFT COLUMN ══════════════
              # Temperature
              - label:
                  id: weather_temperature_today
                  align: TOP_LEFT
                  x: 40
                  y: 12
                  text_font: sg_96
                  text_color: 0xE9EEF4
                  text: "70°"

              # AQI pill next to the temperature
              - !include
                  file: esphome-modular-lvgl-buttons/ui/weather/aqi_pill_widget.yaml
                  vars:
                    aqi_align: TOP_LEFT
                    # x clears a 3-digit temperature ("100°" ends at ~252 in sg_96)
                    aqi_x: "262"
                    aqi_y: "34"
                    aqi_label_font: plex_13
                    aqi_value_font: sg_27
                    aqi_radius: "10"
                    aqi_pad_h: "15"
                    aqi_pad_top: "6"
                    aqi_pad_bottom: "7"

              # Forecast summary text (wraps)
              - label:
                  id: weather_summary_today
                  align: TOP_LEFT
                  x: 40
                  y: 148
                  width: 440

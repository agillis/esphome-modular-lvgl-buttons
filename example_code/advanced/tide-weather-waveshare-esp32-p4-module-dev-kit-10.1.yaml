                            src: tide_dial_needle_img
                            pivot_x: 216
                            pivot_y: 216
                            value: 0
              # Rising/Falling label — centered under the dial (dial box x808..1240),
              # baseline aligned with the meter's TIDE LEVEL caption.
              - label:
                  id: tide_state_label
                  align: TOP_LEFT
                  x: 808
                  y: 736
                  width: 432
                  text_align: CENTER
                  text_font: plex_12
                  text_color: 0x5FD4F4
                  text: "TIDE RISING"

              # ── high/low height labels (module-driven; hidden — the meter top/bottom
              #    labels convey these values in the design; these only satisfy the
              #    local_tide_update.yaml binding contract) ──
              - label: { id: high_tide_height, hidden: true, align: TOP_LEFT, x: 836, y: 200, text_font: plex_12, text_color: 0x7C90A5, text: "0.0 ft" }
              - label: { id: low_tide_height,  hidden: true, align: TOP_LEFT, x: 836, y: 216, text_font: plex_12, text_color: 0x7C90A5, text: "0.0 ft" }
